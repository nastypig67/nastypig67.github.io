    <text x="460" y="350" font-size="59" font-weight="700" fill="#ffb020" letter-spacing="3">IMG_11</text>
    <text x="460" y="423" font-size="24" fill="#6b7f8d" letter-spacing="2">replace me</text>
    <text x="460" y="473" font-size="24" fill="#ffb020" fill-opacity="0.45" letter-spacing="1">920 x 700</text>
