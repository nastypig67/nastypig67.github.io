    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffb020" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0.10"/>
