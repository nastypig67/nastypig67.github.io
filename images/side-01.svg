    <path d="M10 41V10h31"/>
    <path d="M479 10H510v31"/>
    <path d="M10 639V670h31"/>
    <path d="M479 670H510v-31"/>
  </g>

  <!-- label -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <text x="260" y="340" font-size="44" font-weight="700" fill="#ffb020" letter-spacing="3">SIDE_01</text>
    <text x="260" y="395" font-size="18" fill="#6b7f8d" letter-spacing="2">replace me</text>
    <text x="260" y="432" font-size="18" fill="#ffb020" fill-opacity="0.45" letter-spacing="1">520 x 680</text>
  </g>

  <!-- scanline hint -->
