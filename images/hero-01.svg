    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e0ff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#22e0ff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#22e0ff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="520" height="660" fill="#0a0e14"/>
  <rect width="520" height="660" fill="url(#grid)"/>
  <rect width="520" height="660" fill="url(#glow)"/>

  <!-- frame -->
  <rect x="10.5" y="10.5" width="499" height="639" fill="none" stroke="#22e0ff" stroke-opacity="0.42" stroke-width="1"/>

