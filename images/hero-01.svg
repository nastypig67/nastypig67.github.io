    <path d="M10 41V10h31"/>
    <path d="M479 10H510v31"/>
    <path d="M10 619V650h31"/>
    <path d="M479 650H510v-31"/>
  </g>

  <!-- label -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <text x="260" y="330" font-size="44" font-weight="700" fill="#22e0ff" letter-spacing="3">HERO_01</text>
    <text x="260" y="385" font-size="18" fill="#6b7f8d" letter-spacing="2">replace me</text>
    <text x="260" y="422" font-size="18" fill="#22e0ff" fill-opacity="0.45" letter-spacing="1">520 x 660</text>
  </g>

  <!-- scanline hint -->
  <g stroke="#22e0ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 145H520"/><path d="M0 330H520"/><path d="M0 514H520"/>
  </g>
