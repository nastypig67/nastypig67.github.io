    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#00ff9c" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0.10"/>
