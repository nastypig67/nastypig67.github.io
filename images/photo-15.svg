    <text x="400" y="500" font-size="68" font-weight="700" fill="#00ff9c" letter-spacing="3">IMG_15</text>
    <text x="400" y="585" font-size="28" fill="#6b7f8d" letter-spacing="2">replace me</text>
    <text x="400" y="642" font-size="28" fill="#00ff9c" fill-opacity="0.45" letter-spacing="1">800 x 1000</text>
